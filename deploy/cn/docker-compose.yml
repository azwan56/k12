services:
  k12-postgres:
    image: postgres:16-alpine
    container_name: k12-cn-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vanpower_k12}
      POSTGRES_USER: ${POSTGRES_USER:-k12_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - k12_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-k12_app} -d ${POSTGRES_DB:-vanpower_k12}"]
      interval: 10s
      timeout: 5s
      retries: 5

  k12-api:
    build:
      context: ../..
      dockerfile: deploy/cn/Dockerfile.server
    container_name: k12-cn-api
    restart: always
    depends_on:
      k12-postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8787
      TZ: Asia/Shanghai
      APP_ORIGIN: ${APP_ORIGIN:-https://k12.vanpower.net}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://k12.vanpower.net}
      DATABASE_URL: postgres://${POSTGRES_USER:-k12_app}:${POSTGRES_PASSWORD}@k12-postgres:5432/${POSTGRES_DB:-vanpower_k12}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?DASHSCOPE_API_KEY is required}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_MODEL_PRACTICE: ${QWEN_MODEL_PRACTICE:-qwen-plus}
      QWEN_MODEL_MATH_CHALLENGE: ${QWEN_MODEL_MATH_CHALLENGE:-qwen-max}
      QWEN_MODEL_FAST: ${QWEN_MODEL_FAST:-qwen-flash}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_WEBHOOK_TOKEN: ${WECHAT_WEBHOOK_TOKEN:-}
      WECHAT_TEMPLATE_ID_REPORT: ${WECHAT_TEMPLATE_ID_REPORT:-}
      ENABLE_DEV_AUTH: "false"

  k12-web:
    build:
      context: ../..
      dockerfile: deploy/cn/Dockerfile.web
    container_name: k12-cn-web
    restart: always
    depends_on:
      - k12-api
    ports:
      - "127.0.0.1:8088:8080"

volumes:
  k12_pg_data:
